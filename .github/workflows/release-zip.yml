name: Build release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip with version number
        id: build
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          NAME="festive-decorations-${VERSION}"
          git archive --format=zip --prefix="${NAME}/" -o "${NAME}.zip" HEAD \
            -- . ':(exclude).github' ':(exclude).gitignore' ':(exclude).gitattributes'
          echo "zip=${NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "${{ steps.build.outputs.zip }}" --clobber
